<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Chess</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><b>♟ Nova Chess</b><span>ОНЛАЙН</span></header>
<main>
<section class="game">
  <div class="players"><div><b id="whiteName">Белые</b><small id="whiteTime">10:00</small></div><div><b id="blackName">Чёрные</b><small id="blackTime">10:00</small></div></div>
  <div id="board" class="board"></div>
  <div id="status" class="status">Создай комнату или подключись по коду.</div>
</section>
<aside>
  <h2>Новая партия</h2>
  <input id="name" maxlength="20" placeholder="Твой ник">
  <button id="create">Создать комнату</button>
  <div class="join"><input id="room" maxlength="8" placeholder="Код"><button id="join">Войти</button></div>
  <div class="room">Код комнаты: <strong id="roomCode">—</strong></div>
  <h2>Чат</h2>
  <div id="chat" class="chat"></div>
  <div class="join"><input id="message" placeholder="Сообщение"><button id="send">➤</button></div>
  <button id="local" class="secondary">Локальная партия</button>
</aside>
</main>
<script src="app.js"></script>
</body>
</html>
